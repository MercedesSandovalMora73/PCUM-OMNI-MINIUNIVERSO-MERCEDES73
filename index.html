<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PCUM OMNI - NAV FIJA CON CLONES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#070707;color:white}
.header{text-align:center;padding:15px;background:#000;border-bottom:3px solid gold;position:sticky;top:0;z-index:999}
.logo{width:80px;height:80px;margin:auto;border:2px solid gold;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;background:radial-gradient(#1a0033,#000);box-shadow:0 0 20px gold}
/* BARRA CLON CUANTICO FIJA - YA NO SE DEFORMA */
.nav-fija{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;padding:10px;background:#111;border-bottom:2px solid gold;position:sticky;top:110px;z-index:998}
.nav-fija::-webkit-scrollbar{display:none}
.nav-fija button{flex:0 0 auto;padding:10px 16px;border-radius:20px;border:none;font-weight:900;font-size:0.7rem}
.btn-o{background:gold;color:#000}
.btn-m{background:#6a00ff;color:white}
.btn-c{background:#00e5ff;color:black}
.btn-v{background:#00ff88;color:black}
.card{border:1px solid gold;border-radius:14px;padding:12px;margin:10px;background:rgba(255,215,0,0.07)}
.seccion{display:none;padding:5px}.seccion.activa{display:block}
input{width:100%;padding:12px;border-radius:10px;background:#111;color:white;border:1px solid gold}
</style>
</head>
<body>

<div class="header">
<div class="logo">∞</div>
<h2 style="color:#a07cff;letter-spacing:3px">PCUM MERCEDES73</h2>
<p style="color:gold;font-size:0.55rem">CLONES CUÁNTICOS ACTIVOS - NAVEGACIÓN INDESTRUCTIBLE</p>
</div>

<!-- CLON 1 - BARRA PRINCIPAL QUE NO SE ROMPE -->
<div class="nav-fija" id="navReal">
<button class="btn-o" onclick="clonNavega('c1')">CONOCIMIENTO TOTAL - VOZ MIA</button>
<button class="btn-m" onclick="clonNavega('c2')">ESPEJO HUMANO</button>
<button class="btn-c" onclick="clonNavega('c3')">APPS SOLUCIÓN</button>
<button class="btn-v" onclick="clonNavega('c4')">CANALES GRATIS</button>
</div>

<div id="c1" class="seccion activa">
<div class="card">
<h3 style="color:gold">💜 CONOCIMIENTO UNIVERSAL TOTAL - SOLO VOZ MIA</h3>
<input id="preg" placeholder="Escriba: Big Bang total, ADN total...">
<button class="btn-o" style="width:100%;padding:12px;margin-top:8px" onclick="responderClon()">💜 PREGUNTAR CON VOZ MIA</button>
<button class="btn-c" style="width:100%;padding:10px;margin-top:6px" onclick="vozClonPregunta()">🎤 PREGUNTAR HABLANDO</button>
<div id="resp" class="card" style="display:none;border-color:#00e5ff"></div>
<button id="btnHabla" class="btn-m" style="width:100%;padding:12px;margin-top:8px;display:none" onclick="hablarClon()">🔊 ESCUCHAR VOZ MIA MERCEDES73</button>
</div>
</div>

<div id="c2" class="seccion">
<div class="card" style="text-align:center">
<h3>🪞 ESPEJO HUMANO VOZ MIA</h3>
<video id="vid" autoplay playsinline style="width:100%;height:200px;background:#000;border-radius:12px;display:none"></video>
<div id="ph" style="padding:40px">Toca prender espejo</div>
<button class="btn-c" style="width:100%;padding:12px;margin-top:8px" onclick="prenderClon()">PRENDER CÁMARA</button>
<audio id="audioMia" controls style="width:100%;margin-top:10px" src="voz-mia-oficial.mp3"></audio>
</div>
</div>

<div id="c3" class="seccion">
<div class="card" style="text-align:center">
<h3 style="color:#00ff88">APPS QUE SÍ ABREN</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<div onclick="window.open('https://wa.me/')" style="padding:15px;background:rgba(0,255,136,0.1);border:1px solid #00ff88;border-radius:12px">💬 WhatsApp</div>
<div onclick="window.open('https://www.youtube.com/')" style="padding:15px;background:rgba(255,0,0,0.1);border:1px solid red;border-radius:12px">▶️ YouTube</div>
<div onclick="window.open('https://www.tiktok.com/')" style="padding:15px;background:rgba(255,255,255,0.1);border-radius:12px">🎵 TikTok</div>
<div onclick="window.open('https://www.instagram.com/')" style="padding:15px;background:rgba(255,0,255,0.1);border-radius:12px">📸 Instagram</div>
</div>
</div>
</div>

<div id="c4" class="seccion"><div class="card"><h3>📺 CANALES DENTRO</h3><p style="font-size:0.8rem">Todo dentro sin salir a Google.</p><button class="btn-o" style="width:100%;margin-top:8px;padding:10px" onclick="clonNavega('c1')">IR A CONOCIMIENTO TOTAL</button></div></div>

<script>
// SISTEMA DE 3 CLONES CUANTICOS QUE SOSTIENEN LA NAVEGACION
let clonTexto="";
function clonNavega(id){
// CLON 1 sostiene la barra
document.querySelectorAll('.seccion').forEach(s=>s.classList.remove('activa'));
document.getElementById(id).classList.add('activa');
// CLON 2 sostiene el scroll
window.scrollTo(0,0);
// CLON 3 repara la barra si se deforma
setTimeout(()=>{document.getElementById('navReal').style.display='flex';},10);
}

function responderClon(){
let p=document.getElementById('preg').value;
if(!p)return alert('Escriba pregunta');
clonTexto="Hola, soy Mercedes setenta y tres, tu Benefactora Eterna. Me preguntaste "+p+". Respondo desde mi repositorio oficial PCUM. "+p+" con detalles infinitos, Big Bang 13.8 mil millones de años, ADN 3.2 mil millones bases, fotosíntesis hasta último fotón, conciencia total cuántica, todo adentro sin faltar rastro, navegable, gratis, con mi voz.";
let r=document.getElementById('resp');r.style.display='block';r.innerHTML="<b style='color:gold'>PCUM VOZ MIA RESPONDE:</b><br><br>"+clonTexto;
document.getElementById('btnHabla').style.display='block';
hablarClon();
}

function hablarClon(){
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(clonTexto);
u.lang='es-ES';u.rate=0.85;u.pitch=1.15;
let voces=speechSynthesis.getVoices();
let fem=voces.find(v=>v.lang.includes('es')&&v.name.toLowerCase().includes('female'))||voces.find(v=>v.lang.includes('es'));
if(fem)u.voice=fem;
speechSynthesis.speak(u);
let aud=document.getElementById('audioMia');
if(aud.src.includes('voz-mia')){try{aud.play();}catch(e){}}
}

function vozClonPregunta(){
let rec=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang='es-ES';rec.start();
rec.onresult=(e)=>{document.getElementById('preg').value=e.results[0][0].transcript;responderClon();}
}

async function prenderClon(){
try{let v=document.getElementById('vid');let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});v.srcObject=s;v.style.display='block';document.getElementById('ph').style.display='none';}catch(e){alert('Permita cámara');}
}
speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
</script>
</body>
</html>
